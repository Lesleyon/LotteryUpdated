version: '3.8'

services:
  db:
    image: postgres:18
    container_name: lottery-database
    environment:
      POSTGRES_DB: Server_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/DatabaseScript.sql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lottery-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/Server_database
      DB_USER: postgres
      DB_PASSWORD: 1